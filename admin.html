<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelCore Admin</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--m1)"/><stop offset="1" style="stop-color:var(--m2)"/>
      </linearGradient>
    </defs>
    <symbol id="logo" viewBox="0 0 555 555">
      <path fill="url(#g)" fill-rule="evenodd" d="M0 0H262V272H0Z M83 83H248V157H150V255H83Z M295 0H555V272H295Z M472 83H307V157H405V255H472Z M0 297H262V555H0Z M83 472H248V398H150V300H83Z M295 297H555V555H295Z M472 472H307V398H405V300H472Z"/>
      <circle cx="278" cy="279" r="65" style="fill:var(--dot)"/>
    </symbol>
  </svg>
  <div id="toast" class="toast" hidden role="status"></div>
  <header class="nav solid">
    <a class="brand" href="index.html"><svg><use href="#logo"/></svg><span>PixelCore Admin</span></a>
    <div class="tools"><button class="icon-btn" id="theme" aria-label="Mavzuni almashtirish">◐</button><a class="pill" href="index.html">Saytga qaytish</a></div>
  </header>
  <main class="admin">
    <p id="gate" class="muted">Tekshirilmoqda...</p>
    <div id="panel" hidden>
      <div class="stats" id="stats"></div>
      <section class="panel">
        <h2>Yangi o'yin yoki ilova</h2>
        <form id="gameForm">
          <input class="field" id="gTitle" placeholder="Nomi" required>
          <textarea class="field" id="gDesc" placeholder="Tavsif" required></textarea>
          <input class="field" id="gVer" placeholder="Versiya (masalan, v1.0.1)">
          <select class="field" id="gStatus"><option>Chiqarilgan</option><option>Tez orada</option></select>
          <label class="muted" for="gDate">Chiqish sanasi (faqat "Tez orada" uchun)</label>
          <input class="field" id="gDate" type="date">
          <div class="pbox"><b>Android</b>
            <input class="field" id="gAndroid" type="url" placeholder="Yuklab olish havolasi https://... (bo'sh bo'lsa, tugma chiqmaydi)">
            <input class="field" id="gAndroidSize" placeholder="Fayl hajmi (masalan, 45 MB)">
            <input class="field" id="gAndroidReq" placeholder="Talab (masalan, Android 8 va yuqori)">
          </div>
          <div class="pbox"><b>Windows</b>
            <input class="field" id="gWindows" type="url" placeholder="Yuklab olish havolasi https://... (bo'sh bo'lsa, tugma chiqmaydi)">
            <input class="field" id="gWindowsSize" placeholder="Fayl hajmi (masalan, 45 MB)">
            <input class="field" id="gWindowsReq" placeholder="Talab (masalan, Windows 10 va yuqori)">
          </div>
          <div class="pbox"><b>macOS</b>
            <input class="field" id="gMac" type="url" placeholder="Yuklab olish havolasi https://... (bo'sh bo'lsa, tugma chiqmaydi)">
            <input class="field" id="gMacSize" placeholder="Fayl hajmi (masalan, 45 MB)">
            <input class="field" id="gMacReq" placeholder="Talab (masalan, macOS 12 va yuqori)">
          </div>
          <label class="chk"><input type="checkbox" id="gFeat"> Tavsiya etiladi (bosh sahifada tepada katta ko'rsatiladi)</label>
          <label class="muted" for="gIconFile">Ikonka (rasm tanlang, kvadratga avtomatik moslanadi)</label>
          <input class="field" id="gIconFile" type="file" accept="image/*">
          <img id="gIconPrev" class="prev" alt="" hidden style="margin-bottom:12px">
          <label class="muted" for="gShotFile">Qo'shimcha rasmlar / skrinshotlar (ko'pi bilan 8 ta, avtomatik kichraytiriladi)</label>
          <input class="field" id="gShotFile" type="file" accept="image/*" multiple>
          <div class="thumbs" id="gShotPrev"></div>
          <textarea class="field" id="gChange" placeholder="Versiyalar tarixi (masalan: v1.0.1 - xatolar tuzatildi)"></textarea>
          <div class="row"><button class="btn primary sm" id="gSubmit">Qo'shish</button><button type="button" class="btn ghost sm" id="gCancel" hidden>Bekor qilish</button></div>
        </form>
        <div id="gList"></div>
      </section>
      <section class="panel">
        <h2>Yangilik yozish</h2>
        <form id="newsForm">
          <input class="field" id="nTitle" placeholder="Sarlavha" required>
          <textarea class="field" id="nText" placeholder="Matn" required></textarea>
          <div class="row"><button class="btn primary sm" id="nSubmit">E'lon qilish</button><button type="button" class="btn ghost sm" id="nCancel" hidden>Bekor qilish</button></div>
        </form>
        <div id="nList"></div>
      </section>
      <section class="panel"><h2>Sharhlar</h2><div id="rList"></div></section>
      <section class="panel"><h2>Fikr-mulohazalar</h2><div id="fList"></div></section>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
